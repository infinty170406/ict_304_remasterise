services:
  - type: web
    name: infinite-bank-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    branch: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: infinite-bank-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"

databases:
  - name: infinite-bank-db
    databaseName: infinitebankdb
    user: admin
    plan: free
